name: Britam Claims Data Pipeline CI

on:
  push:
    branches: [ main, develop, fabric-integration ]
  pull_request:
    branches: [ main, develop ]

jobs:
  validate-data-pipeline:
    runs-on: ubuntu-latest
    
    steps:
      - name: 🛒 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: ⚙️ Run Data Generation Script
        # Executes generate_data.py to create fresh synthetic data in the CI environment
        run: |
          echo "Generating synthetic claims data..."
          python scripts/generate_data.py
          
      - name: ✅ Validate Generated Data (Custom Tests)
        # Runs our custom assertion-based test suite
        run: |
          echo "Running validation tests..."
          python tests/test_data_generation.py
          
      - name: 🧪 Run Pytest Suite (Bonus Layer)
        # Also runs via pytest for broader compatibility
        run: |
          echo "Running pytest suite..."
          pytest tests/ -v --tb=short
          
      - name: 🧹 Upload Generated Data Artifacts
        # Uploads the CSVs so you can download them from GitHub Actions if needed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-claims-data
          path: data/*.csv
          retention-days: 1